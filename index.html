<title>The Bay Area Weekend Fetch</title>

<style>
:root{--blue:#2F5D8A;--blue-d:#1B3F63;--warm:#B9531F;--ink:#1B2430;--mute:#5A6472;--line:#E3E8ED;--bg:#EEF2F5;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(90deg,rgba(20,48,77,.6) 0%,rgba(20,48,77,.25) 55%,rgba(20,48,77,0) 80%),url(banner.svg?v=2) right bottom/cover no-repeat,var(--blue);color:#fff;padding:20px 18px 0}
header h1,header .slogan{text-shadow:0 1px 3px rgba(10,25,40,.55)}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#DCE7F2}
h1{margin:4px 0 2px;font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:30px;line-height:1.05}
.sub{font-size:13px;color:#E3ECF5;margin:0 0 14px}
.tabs{display:flex;gap:6px;align-items:flex-end;margin:0 -6px}
.tab{flex:1;border:0;border-radius:12px 12px 0 0;font-weight:700;font-size:14px;line-height:1.15;padding:6px 4px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;filter:saturate(.75) brightness(.93)}
.tab .ti{font-size:18px;line-height:1}
.tab[data-view="events"]{background:#DCEAF7;color:#1B3F63}
.tab[data-view="map"]{background:#D3EFEA;color:#0B5E61}
.tab[data-view="our-list"]{background:#FBE1CF;color:#8A3A12}
.tab[aria-selected="true"]{height:66px;filter:none;box-shadow:inset 0 5px 0 currentColor;font-weight:800}
.filters{display:block;padding:10px 16px;background:var(--bg);position:sticky;top:0;z-index:15;box-shadow:0 1px 0 #DDE3E9;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #CBD4DD;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;min-height:38px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.home[aria-pressed="true"]{background:var(--warm);border-color:var(--warm)}
main{flex:1;padding:0 12px 40px}
.section-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:18px 6px 8px}
.card{background:var(--card);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.card .when{font-size:12px;font-weight:600;color:var(--blue)}
.card .title{font-size:16px;font-weight:600;line-height:1.3;margin:2px 0}
.card .meta{font-size:13px;color:var(--mute);line-height:1.45}
.card .row2{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.num{font-size:11px;font-weight:600;color:var(--mute)}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px}
.c-hol{background:#FBE9E1;color:#8A3A14}.c-mkt{background:#E6EEF6;color:#1F4A73}.c-dog{background:#E3F2EA;color:#1F6B4A}
.c-walk{background:#DDF1F1;color:#0B5E61}.c-food{background:#FFF1D6;color:#7A4E00}.c-art{background:#EEE8F6;color:#4E3A78}.c-evt{background:#EEF2F5;color:#1B2430}.c-show{background:#FBE6EE;color:#8A1F4C}.c-kids{background:#E8F4DC;color:#3B6B17}.c-teen{background:#E6E9F7;color:#3A47A0}.c-prog{background:#F1E9E5;color:#5D4037}
.plan-h{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:12px 6px 6px}.plan-h.locked{color:#1E7A4C}
.card.locked{box-shadow:inset 4px 0 0 #2E8B5E}
.lockrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.lockbtn{border:1px solid #2E8B5E;background:#fff;color:#1E6B45;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;min-height:44px}
.lockbtn[aria-pressed="true"]{background:#2E8B5E;color:#fff}
.sched{margin:0 0 6px}.sched-d{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;margin:12px 6px 6px;padding-bottom:4px;border-bottom:1px solid #D5DCE3}.sched-d.free{color:var(--mute);font-weight:600}.sched-d em{font-style:normal;font-weight:500;font-size:13px}
.locksel{font:inherit;font-size:14px;font-weight:600;color:#1E6B45;border:1px solid #2E8B5E;border-radius:10px;padding:9px 10px;min-height:44px;background:#fff;max-width:100%}
.planned{font-size:12px;font-weight:600;color:#fff;background:#2E8B5E;border-radius:999px;padding:3px 9px}
.locknote{font-size:12.5px;color:var(--mute)}.lockc{color:#1E7A4C}
.dist{font-size:12px;color:var(--mute)}
.tbc{font-size:11px;font-weight:600;color:#8A3A14}
.maplink{margin-left:auto;font-size:13px;font-weight:600;text-decoration:none;padding:6px 2px}
.star{background:none;border:0;width:44px;height:44px;margin:-8px -8px 0 0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.star svg{width:22px;height:22px}
.star[aria-pressed="true"] svg{fill:var(--warm);stroke:var(--warm)}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:40px 20px;line-height:1.5}
/* map */
.mapwrap{position:relative;background:#CFE0EE;border-radius:14px;overflow:hidden;margin-top:4px;touch-action:none;width:100%;max-height:72vh}
.mapwrap svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoombar{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.zoombar::-webkit-scrollbar{display:none}
.zbtn{flex:none;border:1px solid #CBD4DD;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;min-height:38px}
.zctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zctl button{width:44px;height:44px;border-radius:10px;border:1px solid #CBD4DD;background:#fff;font-size:22px;font-weight:600;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);padding:8px 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sheet{margin-top:10px}
.pin{cursor:pointer}
.note{font-size:12px;color:var(--mute);padding:6px 4px;line-height:1.5}
footer{font-size:12px;color:var(--mute);text-align:center;padding:10px 20px 30px;line-height:1.6}
.links{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.lbtn{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #CBD4DD;border-radius:10px;padding:11px 8px;min-height:44px;color:var(--blue)}
.lbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.nodogs{background:#fff;border-left:0;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:13px;color:var(--mute);line-height:1.5}
.nodogs strong{color:var(--ink)}
.nodogs ul{margin:6px 0;padding-left:18px}
.seg{display:flex;background:#DDE3E9;border-radius:12px;padding:3px;margin:12px 4px 2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;font-size:15px;min-height:44px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:10px 4px 0;scrollbar-width:none}.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid #CBD4DD;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px;color:var(--blue)}
.wk-h{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:20px;line-height:1.2;margin:28px -4px 0;padding:11px 16px;border-radius:12px;background:#4A5562;color:#fff;position:sticky;top:var(--fh,0px);z-index:12;box-shadow:0 2px 8px rgba(27,36,48,.18)}
.wk-sub{font-size:13.5px;color:var(--mute);margin:8px 6px 10px}
.fbar{display:flex;gap:8px;align-items:center}
.filterbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1.5px solid var(--blue);background:#fff;color:var(--blue-d);border-radius:12px;padding:8px 12px;min-height:46px;font:inherit;text-align:left}
.filterbtn svg{width:20px;height:20px;flex:none}.filterbtn .flabel{font-weight:800;font-size:15px}
.filterbtn .ftxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}.filterbtn .fsum{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:var(--mute);font-weight:500}
.filterbtn .fcount{background:var(--warm);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 7px}
.filterbtn .fcaret{font-size:13px}.filterbtn.on{border-color:var(--warm)}
.fpanel{background:#fff;border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 6px 20px rgba(27,36,48,.15);max-height:70vh;overflow:auto}
.fsec{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:6px 0 8px;display:flex;gap:8px;align-items:baseline}
.fwrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px #fff}
.linkbtn{border:0;background:none;color:var(--blue);text-decoration:underline;font:inherit;font-size:12.5px;text-transform:none;letter-spacing:0;padding:4px}
.dseg{display:flex;background:#EEF2F5;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.dseg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;min-height:42px;color:var(--ink)}
.dseg button[aria-pressed="true"]{background:var(--warm);color:#fff}
.fdone{display:flex;gap:8px;justify-content:flex-end}
.nb{white-space:nowrap}
.prow{background:#fff;border-radius:12px;margin-bottom:6px;overflow:hidden}
.prow.locked{box-shadow:inset 4px 0 0 #2E8B5E}
.prow-h{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px 12px;min-height:56px;font:inherit;color:var(--ink)}
.pmark{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#EEF2F5;color:var(--mute)}
.prow.locked .pmark{background:#2E8B5E;color:#fff}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pw{font-size:12.5px;font-weight:700;color:var(--blue)}.prow.locked .pw{color:#1E7A4C}
.pt{font-size:15.5px;font-weight:700}
.pl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;color:var(--mute);font-size:14px}
.card.inrow{margin:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line);padding-top:10px}
.card.inrow .when,.card.inrow .title{display:none}
.plantools{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:10px 6px 0}
.slogan{font-size:15px;font-weight:500;color:#E3ECF5;margin:2px 0 14px;font-style:italic}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.distsel{position:relative;padding:0;display:flex;align-items:center}.distsel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-weight:600;color:inherit;padding:8px 30px 8px 14px;min-height:38px;border-radius:999px}
.distsel::after{content:"▾";position:absolute;right:12px;pointer-events:none;font-size:12px}
.distsel.on{background:var(--warm);border-color:var(--warm);color:#fff}
.homechip{max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.homebox{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0}.homebox strong{font-size:16px}
.homeform{display:flex;gap:8px;margin:8px 0}.homeform input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid #CBD4DD;border-radius:10px;padding:10px 12px;min-height:44px}
.homemsg{color:#1E7A4C;font-weight:600}.ournote.small{font-size:12px}
.empty.small{padding:14px;font-size:14px;background:#fff;border-radius:14px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:#fff;border-radius:12px;padding:6px 10px 6px 6px;margin-bottom:6px}
.crow .star{margin:0}
.crow .ct{font-weight:600;font-size:15px;display:block;line-height:1.3}
.crow .cw{font-size:13.5px;color:var(--mute);display:block;line-height:1.4;margin-top:1px}
.crow a{font-size:14px;font-weight:600;text-decoration:none;padding:10px 4px;white-space:nowrap}
.who{font-size:12px;font-weight:600;color:#7A4E00;background:#FFF1D6;border-radius:999px;padding:3px 9px}
.ourhead{padding:14px 4px 4px}
.ournote{font-size:13px;color:var(--mute);line-height:1.5;margin:0 0 10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.copybtn.alt{background:#fff;color:var(--ink);border:1px solid #CBD4DD}
.status{font-size:13.5px;font-weight:600;color:#8A3A14;margin:0 0 8px}.status.ok{color:#1F6B4A}
.setup{background:#fff;border-radius:14px;padding:14px 16px;margin:0 0 12px}.setup strong{font-size:16px}
.okmsg{background:#E3F2EA;color:#1F6B4A;font-weight:600;font-size:14.5px;border-radius:10px;padding:10px 12px;margin:0 0 10px}
.copybtn{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;min-height:44px}
.copyarea{width:100%;font:13px/1.5 Inter,sans-serif;border:1px solid #CBD4DD;border-radius:10px;padding:10px;margin-top:4px}
.zbtn[aria-pressed="true"]{background:#FFD54A;border-color:#1B2430}
@media (max-width:600px){
header{padding:12px 16px 0}
.kicker{font-size:11px}
h1{font-size:26px;margin:2px 0 0}
.sub{font-size:13px;margin:0 0 4px;line-height:1.35}
.tab{font-size:14.5px}
.filters{padding:10px 12px}
.chip{padding:8px 14px;font-size:14.5px;min-height:40px}
main{padding:0 10px 40px}
.section-h{font-size:13px;margin:20px 6px 10px}
.card{padding:16px 16px 14px}
.card .when{font-size:14px}
.card .title{font-size:18px;line-height:1.3;margin:4px 0}
.card .meta{font-size:15px;line-height:1.5;color:#4A5462}
.num{font-size:13px}
.tag,.who,.tbc{font-size:13px}
.dist{font-size:14px}
.lbtn{font-size:15px;padding:12px 8px;min-height:46px}
.ournote,.note,.legend,.nodogs{font-size:14.5px}
.zbtn{font-size:14.5px;min-height:42px}
.copybtn{font-size:15px}
footer{font-size:13px}
}
</style>
</head>

function copyOut(t, text, okMsg, label){
  const out = document.getElementById("copyout");
  const fallback = () => { out.innerHTML = `<p class="ournote">Copy this link and text it:</p><textarea class="copyarea" readonly rows="3"></textarea>`; const ta = out.querySelector("textarea"); ta.value = text; ta.focus(); ta.select(); };
  try { navigator.clipboard.writeText(text).then(() => { t.textContent = "Copied ✓"; out.innerHTML = `<p class="ournote">${okMsg}</p>`; setTimeout(() => t.textContent = label, 2500); }, fallback); } catch(e) { fallback(); }
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-startlist")){
    if (!ME && !askName()) return;
    LIST = newCode(); try { localStorage.setItem("wf-list", LIST); } catch(e) {}
    shared = true; me = ME; importedMsg = "Your shared list is ready. Tap “Invite someone to plan” and text them the link.";
    keepListInAddress(); render(); sync();
  } else if (t.hasAttribute("data-joinpaste")){
    let v = ""; try { v = prompt("Paste the invite link you were sent:") || ""; } catch(e) {}
    const m = v.match(/#list-([a-z0-9]{16,40})/) || v.trim().match(/^([a-z0-9]{16,40})$/);
    if (!m){ if (v) { importedMsg = "That doesn't look like an invite link. It should end in #list- followed by letters and numbers."; render(); } return; }
    LIST = m[1]; try { localStorage.setItem("wf-list", LIST); } catch(e) {}
    if (!ME) askName();
    shared = true; me = ME; importedMsg = "You've joined the shared list."; keepListInAddress(); render(); sync();
  } else if (t.hasAttribute("data-invite")){
    copyOut(t, inviteLink(), "Invite link copied. Text it to anyone you plan weekends with. When they open it, they join your plans, on a phone or a computer.", "Invite someone to plan");
  } else if (t.hasAttribute("data-rename")){
    const old = ME;
    if (askName() && ME !== old){
      // move my stars to the new name
      const mineIds = [...picks].filter(([id, p]) => p.uids.includes(old)).map(([id]) => id);
      (async () => { try { for (const id of mineIds){ await rpc("remove_pick", {p_list: LIST, p_item: id, p_who: old}); await rpc("add_pick", {p_list: LIST, p_item: id, p_who: ME, p_item_json: itemSnap(id)}); } } catch(e) {} sync(); })();
      render();
    }
  }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
setInterval(() => { if (document.visibilityState === "visible") sync(); }, 20000);

setTimeout(sync, 0);

render();


</script>
