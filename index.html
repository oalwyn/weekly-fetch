<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Weekly Fetch">
<meta name="theme-color" content="#2F5D8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>The Weekly Fetch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5D8A;--blue-d:#1B3F63;--warm:#B9531F;--ink:#1B2430;--mute:#5A6472;--line:#E3E8ED;--bg:#EEF2F5;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--blue);color:#fff;padding:20px 18px 0}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#DCE7F2}
h1{margin:4px 0 2px;font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:30px;line-height:1.05}
.sub{font-size:13px;color:#E3ECF5;margin:0 0 14px}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:transparent;border:0;color:#DCE7F2;font-weight:600;font-size:14px;padding:12px 4px 13px;border-bottom:3px solid transparent;min-height:44px}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:var(--bg);position:sticky;top:0;z-index:15;box-shadow:0 1px 0 #DDE3E9;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #CBD4DD;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;min-height:38px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.home[aria-pressed="true"]{background:var(--warm);border-color:var(--warm)}
main{flex:1;padding:0 12px 40px}
.section-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:18px 6px 8px}
.card{background:var(--card);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.card .when{font-size:12px;font-weight:600;color:var(--blue)}
.card .title{font-size:16px;font-weight:600;line-height:1.3;margin:2px 0}
.card .meta{font-size:13px;color:var(--mute);line-height:1.45}
.card .row2{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.num{font-size:11px;font-weight:600;color:var(--mute)}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px}
.c-hol{background:#FBE9E1;color:#8A3A14}.c-mkt{background:#E6EEF6;color:#1F4A73}.c-dog{background:#E3F2EA;color:#1F6B4A}
.c-walk{background:#DDF1F1;color:#0B5E61}.c-food{background:#FFF1D6;color:#7A4E00}.c-art{background:#EEE8F6;color:#4E3A78}.c-evt{background:#EEF2F5;color:#1B2430}
.dist{font-size:12px;color:var(--mute)}
.tbc{font-size:11px;font-weight:600;color:#8A3A14}
.maplink{margin-left:auto;font-size:13px;font-weight:600;text-decoration:none;padding:6px 2px}
.star{background:none;border:0;width:44px;height:44px;margin:-8px -8px 0 0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.star svg{width:22px;height:22px}
.star[aria-pressed="true"] svg{fill:var(--warm);stroke:var(--warm)}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:40px 20px;line-height:1.5}
/* map */
.mapwrap{position:relative;background:#CFE0EE;border-radius:14px;overflow:hidden;margin-top:4px;touch-action:none;width:100%;aspect-ratio:1000/1041;max-height:72vh}
.mapwrap svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoombar{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.zoombar::-webkit-scrollbar{display:none}
.zbtn{flex:none;border:1px solid #CBD4DD;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;min-height:38px}
.zctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zctl button{width:44px;height:44px;border-radius:10px;border:1px solid #CBD4DD;background:#fff;font-size:22px;font-weight:600;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);padding:8px 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sheet{margin-top:10px}
.pin{cursor:pointer}
.note{font-size:12px;color:var(--mute);padding:6px 4px;line-height:1.5}
footer{font-size:12px;color:var(--mute);text-align:center;padding:10px 20px 30px;line-height:1.6}
.links{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.lbtn{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #CBD4DD;border-radius:10px;padding:11px 8px;min-height:44px;color:var(--blue)}
.lbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.nodogs{background:#fff;border-left:0;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:13px;color:var(--mute);line-height:1.5}
.nodogs strong{color:var(--ink)}
.nodogs ul{margin:6px 0;padding-left:18px}
.seg{display:flex;background:#DDE3E9;border-radius:12px;padding:3px;margin:12px 4px 2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;font-size:15px;min-height:44px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:10px 4px 0;scrollbar-width:none}.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid #CBD4DD;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px;color:var(--blue)}
.wk-h{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:22px;margin:26px 6px 2px;line-height:1.2}
.wk-sub{font-size:13.5px;color:var(--mute);margin:0 6px 10px}
.empty.small{padding:14px;font-size:14px;background:#fff;border-radius:14px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:#fff;border-radius:12px;padding:6px 10px 6px 6px;margin-bottom:6px}
.crow .star{margin:0}
.crow .ct{font-weight:600;font-size:15px;display:block;line-height:1.3}
.crow .cw{font-size:13.5px;color:var(--mute);display:block;line-height:1.4;margin-top:1px}
.crow a{font-size:14px;font-weight:600;text-decoration:none;padding:10px 4px;white-space:nowrap}
.who{font-size:12px;font-weight:600;color:#7A4E00;background:#FFF1D6;border-radius:999px;padding:3px 9px}
.ourhead{padding:14px 4px 4px}
.ournote{font-size:13px;color:var(--mute);line-height:1.5;margin:0 0 10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.copybtn.alt{background:#fff;color:var(--ink);border:1px solid #CBD4DD}
.status{font-size:13.5px;font-weight:600;color:#8A3A14;margin:0 0 8px}.status.ok{color:#1F6B4A}
.okmsg{background:#E3F2EA;color:#1F6B4A;font-weight:600;font-size:14.5px;border-radius:10px;padding:10px 12px;margin:0 0 10px}
.copybtn{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;min-height:44px}
.copyarea{width:100%;font:13px/1.5 Inter,sans-serif;border:1px solid #CBD4DD;border-radius:10px;padding:10px;margin-top:4px}
.zbtn[aria-pressed="true"]{background:#FFD54A;border-color:#1B2430}
@media (max-width:600px){
header{padding:12px 16px 0}
.kicker{font-size:11px}
h1{font-size:26px;margin:2px 0 0}
.sub{font-size:13px;margin:0 0 4px;line-height:1.35}
.tab{padding:10px 4px 11px;font-size:15px}
.filters{padding:10px 12px}
.chip{padding:8px 14px;font-size:14.5px;min-height:40px}
main{padding:0 10px 40px}
.section-h{font-size:13px;margin:20px 6px 10px}
.card{padding:16px 16px 14px}
.card .when{font-size:14px}
.card .title{font-size:18px;line-height:1.3;margin:4px 0}
.card .meta{font-size:15px;line-height:1.5;color:#4A5462}
.num{font-size:13px}
.tag,.who,.tbc{font-size:13px}
.dist{font-size:14px}
.lbtn{font-size:15px;padding:12px 8px;min-height:46px}
.ournote,.note,.legend,.nodogs{font-size:14.5px}
.zbtn{font-size:14.5px;min-height:42px}
.copybtn{font-size:15px}
footer{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
<header id="hdr">
  <div class="kicker">San Francisco → Mountain View</div>
  <h1>The Weekly Fetch</h1>
  <p class="sub" id="updated"></p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="events" aria-selected="true">Events</button>
    <button class="tab" role="tab" data-view="map" aria-selected="false">Map</button>
    <button class="tab" role="tab" data-view="our-list" aria-selected="false">Our list <span id="savedCount"></span></button>
  </div>
</header>
<div class="filters" id="filters" aria-label="Filter events"></div>
<main id="main"></main>
<footer>Event details come from public listings. Check with the organizer before you go.<br>Refreshed every Monday and Thursday morning. Your stars are kept between refreshes.</footer>
</div>
<script src="./data.js"></script>
<script src="./walks.js"></script>

const CATS = {hol:{label:"Holiday",color:"#C4562A"},mkt:{label:"Markets",color:"#2F6FA8"},dog:{label:"Dog",color:"#2E8B5E"},food:{label:"Pizza & coffee",color:"#C98A00"},art:{label:"Art",color:"#6E55A8"},walk:{label:"Dog walks",color:"#0F7C80"},evt:{label:"Events",color:"#4A5562"}};
const SECTIONS = (WF.sections || [["week","This week"]]).slice();
{ const i = SECTIONS.findIndex(s=>s[0]==="dog"); SECTIONS.splice(i>=0?i+1:1, 0, ["walks","Dog walks · closest to home first"]); }
const VIEWS = ["events","map","our-list"];

let state = {view:"events", cat:"all", near:false, sel:null, group:"weekend"};
try { const g = localStorage.getItem("wf-group"); if (g==="weekend"||g==="date") state.group = g; } catch(e) {}
/* ---- dates & weekends ---- */
const DAYMS = 864e5, DAYN = ["sun","mon","tue","wed","thu","fri","sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const parseD = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const TODAY = (()=>{ const t = new Date(); t.setHours(0,0,0,0); return t; })();
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
function weekends(){
  const dow = TODAY.getDay();
  let sat = dow===0 ? addD(TODAY,-1) : addD(TODAY,(6-dow));
  return [0,1,2,3].map(i=>{ const s = addD(sat,7*i); return {fri:addD(s,-1), sat:s, sun:addD(s,1)}; });
}
function occurs(e, a, b){
  if (e.dates) return e.dates.some(x=>{ const t=parseD(x); return t>=a && t<=b; }) ? "main" : null;
  if (!e.start) return null;
  const s = parseD(e.start), en = e.end ? parseD(e.end) : new Date(2100,0,1);
  if (en < a || s > b) return null;
  if (s >= a && s <= b && (en - s)/DAYMS > 3) return "main";   // opening weekend counts as a main event
  if (e.days){ for (let t = new Date(Math.max(+a,+s)); t<=b && t<=en; t = addD(t,1)) if (e.days.includes(DAYN[t.getDay()])) return "ongoing"; return null; }
  return (en - s)/DAYMS > 3 ? "ongoing" : "main";
}
const isPast = e => { const last = e.dates ? parseD(e.dates[e.dates.length-1]) : (e.end ? parseD(e.end) : (e.start && !e.days ? parseD(e.start) : null)); return last && last < TODAY; };
const startOf = e => e.dates ? parseD(e.dates[0]) : (e.start ? parseD(e.start) : null);
const fmtRange = (a,b) => a.getMonth()===b.getMonth() ? `${MON[a.getMonth()]} ${a.getDate()}–${b.getDate()}` : `${MON[a.getMonth()]} ${a.getDate()} – ${MON[b.getMonth()]} ${b.getDate()}`;
/* ---- stars: shared through db when available, else this device ---- */
let db = null, userApi = null, me = null, shared = false, canWrite = true, dbNote = "";
let picks = new Map();          // id -> {uids:[], item}
let names = {};                 // uid -> display name
const pending = new Set();
let localSaved = new Set();
try { const s = localStorage.getItem("wf-saved-ids"); if (s) localSaved = new Set(JSON.parse(s)); } catch(e) {}
function persistLocal(){
  try { localStorage.setItem("wf-saved-ids", JSON.stringify([...localSaved])); } catch(e) {}
  syncHash();
}
function syncHash(){
  // after opening a shared picks link, tidy the address back to the plain site URL
  if (location.hash.startsWith("#picks-")) { try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {} }
}
try { const v = localStorage.getItem("wf-view2"); if (VIEWS.includes(v)) state.view = v; } catch(e) {}
if (VIEWS.includes(location.hash.slice(1))) state.view = location.hash.slice(1);
const PAGE_URL = location.origin + location.pathname;
const code = id => { let h = 5381; for (const c of id) h = ((h*33) ^ c.charCodeAt(0)) >>> 0; return (h % 1679616).toString(36).padStart(4,"0"); };
let importedMsg = "";
let pendingImport = [];
(function readPicksLink(){
  const h = location.hash.slice(1);
  if (!h.startsWith("picks-")) return;
  const codes = new Set(h.slice(6).split("-").filter(Boolean));
  const all = (window.WF_DATA?WF_DATA.items:[]).concat(window.WF_WALKS?WF_WALKS.items:[]);
  pendingImport = all.filter(e=>codes.has(code(e.id))).map(e=>e.id);
  const before = new Set(localSaved);
  pendingImport.forEach(id=>localSaved.add(id));
  const fresh = pendingImport.filter(id=>!before.has(id));
  if (fresh.length){ importedMsg = `Added ${fresh.length} pick${fresh.length===1?"":"s"} from the link you opened.`; state.view = "our-list"; }

  persistLocal();
})();
function picksLink(){ return PAGE_URL + "#picks-" + starredIds().map(code).join("-"); }
setTimeout(syncHash, 0);

const starredByMe = id => shared ? !!(picks.get(id) && picks.get(id).uids.includes(me)) : localSaved.has(id);
const starredIds = () => shared ? [...picks.keys()] : [...localSaved];
const pickers = id => shared && picks.get(id) ? picks.get(id).uids : [];

function miles(a,b,c,d){const R=3958.8,r=Math.PI/180;const x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const infoUrl = e => (e.url && /^https?:\/\//.test(e.url)) ? e.url : "https://www.google.com/search?q="+encodeURIComponent((e.title||"")+" "+((e.meta||"").split(" · ")[0]));
const gmaps = e => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.q||e.title);
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';

function whoLine(id){
  const u = pickers(id); if(!u.length) return "";
  const list = u.map(x => x===me ? "You" : (names[x] || "Someone"));
  list.sort((a,b)=> a==="You" ? -1 : b==="You" ? 1 : 0);
  return `<span class="who">★ ${esc(list.join(" & "))}</span>`;
}
function filtered(){
  return DATA.filter(e => (state.cat==="all" || e.cat===state.cat || (state.cat==="dog" && e.cat==="walk")) && (!state.near || (e.mi!=null && e.mi<=15)));
}
function cardHTML(e, gone){
  const c = CATS[e.cat] || CATS.evt;

async function toggleStar(id){
  if (pending.has(id)) return;
  const e = DATA.find(d=>d.id===id) || (picks.get(id)&&picks.get(id).item) || {id};
  if (shared && canWrite){
    pending.add(id);
    const ref = db.collection("picks").doc((id+"--"+me).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").slice(0,190));
    const mine = starredByMe(id);
    // optimistic
    const p = picks.get(id) || {uids:[], item:e};
    p.uids = mine ? p.uids.filter(u=>u!==me) : [...p.uids, me];
    if (p.uids.length) picks.set(id,p); else picks.delete(id);
    refreshStars();
    try {
      if (mine) await ref.delete();
      else await ref.set({id, uid:me, at:new Date().toISOString(), item:{id:e.id, n:e.n||null, title:e.title||"", when:e.when||"", meta:e.meta||"", cat:e.cat||"evt", q:e.q||null, url:e.url||null, lat:e.lat??null, lon:e.lon??null}});
    } catch(err) {
      // couldn't write the shared list: keep stars on this device instead (and in the page address)
      const mineNow = [...picks.entries()].filter(([k,p])=>p.uids.includes(me)).map(([k])=>k);
      canWrite=false; shared=false;
      mineNow.forEach(k=>localSaved.add(k)); if (mine) localSaved.delete(id); else localSaved.add(id);
      persistLocal();
      dbNote = "The shared list couldn't be saved to, so stars are being kept on this device.";
      refreshStars();
    } finally { pending.delete(id); }
  } else {
    localSaved.has(id) ? localSaved.delete(id) : localSaved.add(id); persistLocal(); refreshStars();
  }
}
async function resolveNames(){

async function connect(){
