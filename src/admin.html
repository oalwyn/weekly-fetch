<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fetch engagement (owner)</title>
<style>
:root{--ink:#1B2430;--mute:#5A6472;--line:#E3E8ED;--bg:#EEF2F5;--card:#fff;--blue:#2F5D8A;--warn:#8A3A12;--ok:#1E6B45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:16px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 12px}
section{background:var(--card);border-radius:12px;padding:14px 14px 10px;margin:0 0 14px;overflow-x:auto}
.def{color:var(--mute);font-size:12.5px;margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute);font-size:12px}
.na{color:#98A2AD;font-style:italic}
[hidden]{display:none !important}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
button,select,input{font:inherit;border:1px solid #CBD4DD;border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.note{background:#FFF6E0;border:1px solid #E8C77A;border-radius:10px;padding:10px 12px;margin:0 0 14px}
.err{background:#FBE9E1;border:1px solid #E6A98C;border-radius:10px;padding:10px 12px;margin:0 0 14px;color:var(--warn)}
ul{margin:4px 0 4px 18px;padding:0}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>The Weekend Fetch: engagement</h1>
<p class="sub">Owner only. Every number below comes from production records, with development, test and owner activity left out.</p>
<div id="msg"></div>
<div class="bar" id="controls" hidden>
  <label>City <select id="city"><option value="">All cities</option>__CITY_OPTIONS__</select></label>
  <label>Weeks <select id="weeks"><option>4</option><option selected>8</option><option>12</option><option>26</option></select></label>
  <button class="primary" id="refresh">Refresh</button>
  <button id="csvWeekly">Weekly CSV</button>
  <button id="deck" title="A PowerPoint file with charts, built from the latest numbers for the city and weeks picked here. Opens in PowerPoint, Keynote and Google Slides.">Presentation (PowerPoint)</button>
  <span style="flex:1"></span>
  <label>Raw records from <input type="date" id="from"></label>
  <label>to <input type="date" id="to"></label>
  <label><input type="checkbox" id="incl"> include excluded</label>
  <button id="csvRaw">Raw CSV</button>
</div>
<div id="out"></div>
</main>
<script src="../vendor/supabase-2.118.0.js"></script>
<script>
const SB_URL = "__SB_URL__", SB_KEY = "__SB_KEY__";
const SB_REF = (SB_URL.split("//")[1] || "").split(".")[0];
const client = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "sb-" + SB_REF + "-auth-token" } });
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CITY_NAMES = Object.assign(__CITY_NAMES__, { unknown: "Unknown (older page)" });
const NA = '<span class="na">not yet eligible</span>';
const pct = (n, d) => d ? `${n} / ${d} (${Math.round(100 * n / d)}%)` : NA;
let REPORT = null;
function table(cols, rows){
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cols.length}" class="na">no records</td></tr>`}</tbody></table>`;
}
function csv(rows){
  if (!rows.length) return "";
  const keys = [...new Set(rows.flatMap(r => Object.keys(r)))];
  const cell = v => { v = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  return [keys.join(","), ...rows.map(r => keys.map(k => cell(r[k])).join(","))].join("\n");
}
function download(name, text){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click();
}
const ACTIONS = [["event_detail_viewed","Detail views"],["map_event_opened","Map opens"],["event_starred","Stars"],["event_locked_in","Locked in"],
  ["rsvp_set","Going/Maybe/Can't"],["meetup_set","Meet-ups set"],["calendar_added","Added to calendar (iOS)"],["invite_shared","Invites shared"],
  ["group_joined","Groups joined"],["group_created","Groups created"],["outbound_booking_clicked","Booking clicks"],["outbound_info_clicked","Info clicks"],
  ["directions_clicked","Directions"],["filter_applied","Filters"],["results_empty","Empty results"]];
function render(r){
  const W = r.weekly.slice().reverse();
  const act = r.activation.slice().reverse(), ret = r.retention.slice().reverse();
  let h = `<div class="note"><b>Definitions.</b> Weeks run Monday 00:00 to Sunday 23:59, ${esc(r.timezone)} (stored times are UTC). Measurement started ${esc(r.instrumentation_start)}; nothing earlier is included. Raw records are kept ${esc(r.retention_months)} months.
  <ul><li><b>Visitor</b> = one browser or app install while signed out (not a person). <b>Account</b> = one signed-in account. The same person can be both; they are never added together here.</li>
  <li><b>Meaningful action</b> = star, lock-in, a confirmed change to a group plan (move, Going/Maybe/Can't, meet-up), calendar add confirmed by iOS, or a click on a Tickets link. A booking click is not a purchase; a locked-in plan is not attendance.</li>
  <li>Generated ${esc(new Date(r.generated_at).toLocaleString())}. "not yet eligible" means the time window hasn't ended, not zero.</li></ul></div>`;
  const CN = c => (CITY_NAMES[c] || c);
  h += `<section><h2>Cities</h2><p class="def">Every city side by side for the selected weeks${r.city ? "" : ""}. ${r.city ? "The rest of this page shows <b>" + esc(CN(r.city)) + "</b> only." : "The rest of this page shows all cities together; pick one above to see it alone."} A visitor who uses two cities counts in each.</p>` +
    table([["City", x => esc(CN(x.city))], ["Visitors and accounts", x => x.identities], ["With a meaningful action", x => x.meaningful_identities], ["Active groups", x => x.active_groups],
      ["Event views", x => x.views], ["Stars", x => x.stars], ["Locked", x => x.locks], ["Booking clicks", x => x.booking_clicks]], r.by_city || []) + `</section>`;
  h += `<section><h2>Weekly</h2><p class="def">Distinct identities per reporting week. Groups: active = a confirmed plan change that week; collaborative = at least two different accounts contributed that week.</p>` +
    table([["Week of", x => esc(x.week)], ["Visitors", x => x.visitors], ["New visitors", x => x.new_visitors], ["Accounts", x => x.accounts], ["New accounts", x => x.new_accounts],
      ["Meaningful: visitors", x => x.wmu_anonymous], ["Meaningful: accounts", x => x.wmu_accounts], ["Active groups", x => x.active_groups], ["Collaborative groups", x => x.collaborative_groups],
      ["Web sessions", x => x.web_sessions], ["iOS sessions", x => x.ios_sessions], ["Android sessions", x => x.android_sessions || 0]], W) + `</section>`;
  h += `<section><h2>Key actions</h2><p class="def">Records (unique identities) per week. Stars and lock-ins include plans kept on a device (reported by the device) and group plans (confirmed by the server).</p>` +
    table([["Action", a => esc(a[1])], ...W.map(x => [x.week, a => { const v = x.actions && x.actions[a[0]]; return v ? `${v.records} (${v.identities})` : "0"; }])], ACTIONS) + `</section>`;
  h += `<div class="grid2"><section><h2>Activation</h2><p class="def">Cohort = identities first seen that week. Same session = first meaningful action in the session where they were first seen. 7 days = within 168 hours of first seen; only identities first seen at least 7 days ago are counted.</p>` +
    table([["First seen", x => esc(x.week)], ["Type", x => esc(x.identity_type)], ["New", x => x.new_identities], ["Same session", x => pct(x.same_session_activated, x.new_identities)],
      ["Within 7 days", x => x.eligible_7d ? pct(x.activated_7d, x.eligible_7d) : NA]], act) + `</section>`;
  h += `<section><h2>Meaningful retention</h2><p class="def">Cohort = week of the first meaningful action. Week k = another meaningful action in exactly the k-th following Monday–Sunday week. Shown once that week has ended.</p>` +
    table([["Cohort week", x => esc(x.cohort_week)], ["Type", x => esc(x.identity_type)], ["Size", x => x.cohort_size],
      ["Week 1", x => x.week1 == null ? NA : pct(x.week1, x.cohort_size)], ["Week 2", x => x.week2 == null ? NA : pct(x.week2, x.cohort_size)], ["Week 4", x => x.week4 == null ? NA : pct(x.week4, x.cohort_size)]], ret) + `</section></div>`;
  h += `<section><h2>Discovery → action (7 days)</h2><p class="def">Identities first seen in the period and at least 7 days ago. Each column is counted on its own within 7 days of first seen; no earlier step is required (a booking click counts without a star).</p>` +
    table([["Type", x => esc(x.identity_type)], ["Eligible", x => x.eligible], ["Looked at an event", x => pct(x.looked_at_event, x.eligible)],
      ["Meaningful action", x => pct(x.meaningful_action, x.eligible)], ["Booking click", x => pct(x.booking_click, x.eligible)]], r.funnel) + `</section>`;
  h += `<section><h2>Top events</h2><p class="def">In the selected weeks. Detail view = plan row opened; map open = pin tapped.</p>` +
    table([["Event id", x => esc(x.item_id)], ["Category", x => esc(x.category || "")], ["Region", x => esc(x.region || "")], ["Detail", x => x.detail_views], ["Map", x => x.map_opens],
      ["Stars", x => x.stars], ["Locked", x => x.locks], ["Booking clicks", x => x.booking_clicks], ["Info clicks", x => x.info_clicks], ["Identities", x => x.identities]], r.top_items) + `</section>`;
  h += `<div class="grid2"><section><h2>Categories</h2>` + table([["Category", x => esc(x.category)], ["Views", x => x.views], ["Stars", x => x.stars], ["Locked", x => x.locks], ["Booking clicks", x => x.booking_clicks]], r.by_category) +
    `</section><section><h2>Regions</h2>` + table([["Region", x => esc(x.region)], ["Views", x => x.views], ["Stars", x => x.stars], ["Locked", x => x.locks], ["Booking clicks", x => x.booking_clicks]], r.by_region) + `</section></div>`;
  h += `<div class="grid2"><section><h2>First observed source</h2><p class="def">Identities first seen in the period, by how their first session arrived: UTM tag, invite link, search engine, other site, or direct/unknown (no referrer).</p>` +
    table([["Type", x => esc(x.identity_type)], ["Source", x => esc(x.source)], ["Identities", x => x.identities]], r.acquisition) +
    `</section><section><h2>Platforms</h2>` + table([["Platform", x => esc(x.platform)], ["Identities", x => x.identities], ["Records", x => x.records]], r.platforms) + `</section></div>`;
  const hl = r.health;
  h += `<section><h2>Instrumentation health (last 14 days, all records)</h2><p class="def">${hl.excluded_last_14_days} records left out of KPIs (development, internal or owner devices). ${hl.internal_entries} accounts/devices on the internal list.</p>` +
    table([["Day", x => esc(x.day)], ["Platform", x => esc(x.platform)], ["Evidence", x => esc(x.evidence)], ["Environment", x => esc(x.environment)], ["Internal", x => x.is_internal ? "yes" : ""], ["Records", x => x.records]], hl.by_day) +
    `<h2 style="margin-top:12px">Rejected records</h2>` + table([["Day", x => esc(x.day)], ["Reason", x => esc(x.reason)], ["Count", x => x.n]], hl.rejects) +
    `<h2 style="margin-top:12px">App versions</h2>` + table([["Platform", x => esc(x.platform)], ["Version", x => esc(x.app_version)], ["Records", x => x.records]], hl.app_versions) + `</section>`;
  h += `<section><h2>Known limitations</h2><ul>
    <li>Visitors are browsers or app installs, not people. Safari, the home-screen web app, the iPhone app and a laptop each count separately; a shared device can hide several people. Signed-out and signed-in activity are never linked.</li>
    <li>Stars and lock-ins on plans kept on a device, link clicks, views and filters are reported by the device (they can be lost offline, blocked, or sent by older versions). Group plan changes are confirmed by the server.</li>
    <li>Calendar adds exist only in the iPhone app and count when iOS reports the event as saved. Booking clicks count taps on Tickets links only; what happens on the ticket site is unknown.</li>
    <li>The iPhone app records the new events from version 1.3. Older app versions are still counted for group plan changes (server-confirmed) but not for device-only actions.</li>
    <li>TestFlight and App Store builds are the same app; owner devices are excluded by marking them. Bots aren't fully detectable.</li>
    <li>Deleted accounts and device codes deleted on request are removed or unlinked, so past weeks can change slightly.</li></ul></section>`;
  $("out").innerHTML = h;
}
/* ---- Presentation: a PowerPoint deck with charts, built in the browser from the latest report (PptxGenJS, vendor/) ---- */
let PPTX_LIB = null;
const loadPptx = () => PPTX_LIB || (PPTX_LIB = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "../vendor/pptxgen-3.12.0.bundle.js"; s.onload = res; s.onerror = () => { PPTX_LIB = null; rej(new Error("Couldn't load the presentation library. Check the connection and try again.")); }; document.head.appendChild(s); }));
async function eventTitles(){
  const m = {};
  for (const p of ["../data.js", "../sydney/data.js"]) {
    try { const t = await (await fetch(p + "?v=" + Date.now())).text(); const w = {}; new Function("window", t)(w); ((w.WF_DATA && w.WF_DATA.items) || []).forEach(e => { m[e.id] = e.title; }); } catch (e) {}
  }
  return m;
}
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const wkLabel = s => { const d = new Date(s + "T12:00:00"); return isNaN(d) ? String(s) : `${MON3[d.getMonth()]} ${d.getDate()}`; };
async function buildDeck(r, cityLabel, weeks){
  await loadPptx();
  const titles = await eventTitles();
  const P = new PptxGenJS(); P.layout = "LAYOUT_WIDE"; P.author = "The Weekend Fetch"; P.company = "Alwyn Ventures LLC"; P.title = "The Weekend Fetch: engagement";
  const C = { navy: "1B3F63", blue: "2F5D8A", orange: "C4562A", green: "2E8B5E", teal: "00897B", pink: "D81B60", amber: "C98A00", purple: "6E55A8", grey: "5A6472", ink: "1B2430", light: "EEF2F5", line: "E3E8ED" };
  const PAL = [C.blue, C.orange, C.green, C.purple, C.amber, C.teal, C.pink, C.grey];
  const FONT = "Helvetica";
  const gen = new Date(r.generated_at || Date.now());
  const footer = `${cityLabel} · last ${weeks} weeks · generated ${gen.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })} · production records only (owner, test and development activity left out)`;
  const W = (r.weekly || []).slice().sort((a, b) => a.week < b.week ? -1 : 1);
  const labels = W.map(w => wkLabel(w.week));
  const num = v => +v || 0;
  const CN = c => (CITY_NAMES[c] || c || "Unknown");
  let pageNo = 0;
  const slide = (title, sub) => {
    const s = P.addSlide(); pageNo++;
    s.background = { color: "FFFFFF" };
    s.addShape(P.ShapeType.rect, { x: 0, y: 0, w: 13.333, h: 0.12, fill: { color: C.blue }, line: { color: C.blue } });
    s.addText(title, { x: 0.5, y: 0.3, w: 12.3, h: 0.6, fontFace: FONT, fontSize: 26, bold: true, color: C.ink });
    if (sub) s.addText(sub, { x: 0.5, y: 0.88, w: 12.3, h: 0.45, fontFace: FONT, fontSize: 13, color: C.grey });
    s.addText(footer, { x: 0.5, y: 7.05, w: 11.6, h: 0.3, fontFace: FONT, fontSize: 9, color: "98A2AD" });
    s.addText(String(pageNo), { x: 12.3, y: 7.05, w: 0.6, h: 0.3, fontFace: FONT, fontSize: 9, color: "98A2AD", align: "right" });
    return s;
  };
  const empty = (s, msg) => s.addText(msg || "No records in this period yet.", { x: 0.5, y: 3.2, w: 12.3, h: 0.8, fontFace: FONT, fontSize: 18, color: C.grey, align: "center" });
  const chartBase = { x: 0.5, y: 1.45, w: 12.3, h: 5.4, catAxisLabelFontFace: FONT, valAxisLabelFontFace: FONT, catAxisLabelFontSize: 11, valAxisLabelFontSize: 11, catAxisLabelColor: C.grey, valAxisLabelColor: C.grey,
    showLegend: true, legendPos: "b", legendFontFace: FONT, legendFontSize: 12, valGridLine: { color: C.line, size: 1 }, catGridLine: { style: "none" }, dataLabelFontFace: FONT, dataLabelFontSize: 10 };
  const tableOpts = (colW) => ({ x: 0.5, y: 1.45, w: 12.3, colW, fontFace: FONT, fontSize: 11, color: C.ink, border: { type: "solid", pt: 0.5, color: C.line }, valign: "middle", rowH: 0.32, autoPage: false });
  const hdr = cells => cells.map(t => ({ text: t, options: { bold: true, color: "FFFFFF", fill: { color: C.navy } } }));

  // 1. Cover with headline numbers for the last complete week (and the change from the week before)
  const now = Date.now(), done = W.filter(w => new Date(w.week + "T00:00:00").getTime() + 7 * 864e5 <= now);
  const cur = done[done.length - 1], prev = done[done.length - 2];
  const s1 = P.addSlide(); pageNo++;
  s1.background = { color: C.navy };
  s1.addText("The Weekend Fetch", { x: 0.6, y: 0.6, w: 12, h: 0.9, fontFace: FONT, fontSize: 40, bold: true, color: "FFFFFF" });
  s1.addText(`Engagement report · ${cityLabel} · last ${weeks} weeks`, { x: 0.6, y: 1.45, w: 12, h: 0.6, fontFace: FONT, fontSize: 20, color: "C9D6E3" });
  s1.addText(`Generated ${gen.toLocaleString()}`, { x: 0.6, y: 2.0, w: 12, h: 0.4, fontFace: FONT, fontSize: 13, color: "9FB2C6" });
  if (cur) {
    s1.addText(`Week of ${wkLabel(cur.week)}${prev ? ` (change from week of ${wkLabel(prev.week)})` : ""}`, { x: 0.6, y: 2.9, w: 12, h: 0.4, fontFace: FONT, fontSize: 14, color: "C9D6E3" });
    const tiles = [["Visitors", cur.visitors, prev && prev.visitors], ["Signed-in accounts", cur.accounts, prev && prev.accounts],
      ["Took a meaningful action", num(cur.wmu_anonymous) + num(cur.wmu_accounts), prev && num(prev.wmu_anonymous) + num(prev.wmu_accounts)], ["Active groups", cur.active_groups, prev && prev.active_groups]];
    tiles.forEach(([k, v, p], i) => {
      const x = 0.6 + i * 3.08;
      s1.addShape(P.ShapeType.roundRect, { x, y: 3.45, w: 2.85, h: 2.3, fill: { color: "FFFFFF" }, line: { color: "FFFFFF" }, rectRadius: 0.12 });
      s1.addText(String(num(v)), { x, y: 3.6, w: 2.85, h: 1.0, fontFace: FONT, fontSize: 44, bold: true, color: C.navy, align: "center" });
      s1.addText(k, { x, y: 4.6, w: 2.85, h: 0.45, fontFace: FONT, fontSize: 14, color: C.grey, align: "center" });
      if (p != null) { const d = num(v) - num(p), pc = num(p) ? Math.round(100 * d / num(p)) : null;
        s1.addText(d === 0 ? "no change" : `${d > 0 ? "▲" : "▼"} ${Math.abs(d)}${pc != null ? ` (${Math.abs(pc)}%)` : ""}`, { x, y: 5.1, w: 2.85, h: 0.4, fontFace: FONT, fontSize: 13, bold: true, color: d > 0 ? C.green : d < 0 ? C.orange : C.grey, align: "center" }); }
    });
  } else s1.addText("No complete week in this period yet.", { x: 0.6, y: 3.4, w: 12, h: 0.6, fontFace: FONT, fontSize: 18, color: "C9D6E3" });
  s1.addText(footer, { x: 0.6, y: 6.9, w: 12, h: 0.4, fontFace: FONT, fontSize: 10, color: "9FB2C6" });

  // 2. People per week
  let s = slide("People using The Weekend Fetch", "Distinct visitors (browsers or app installs) and signed-in accounts each week. The latest week may still be in progress.");
  if (W.length) s.addChart(P.ChartType.line, [{ name: "Visitors", labels, values: W.map(w => num(w.visitors)) }, { name: "New visitors", labels, values: W.map(w => num(w.new_visitors)) },
    { name: "Accounts", labels, values: W.map(w => num(w.accounts)) }, { name: "New accounts", labels, values: W.map(w => num(w.new_accounts)) }],
    Object.assign({}, chartBase, { chartColors: [C.blue, "8FB3D6", C.orange, "E8A98C"], lineSize: 3, lineDataSymbolSize: 8 })); else empty(s);

  // 3. Meaningful actions and groups
  s = slide("Who took a meaningful action", "Star, lock-in, a confirmed group plan change, a calendar add or a Tickets click. Bars: people; line: groups that changed a plan that week.");
  if (W.length) s.addChart([{ type: P.ChartType.bar, data: [{ name: "Visitors (signed out)", labels, values: W.map(w => num(w.wmu_anonymous)) }, { name: "Accounts", labels, values: W.map(w => num(w.wmu_accounts)) }], options: { barGrouping: "stacked", chartColors: [C.blue, C.orange] } },
    { type: P.ChartType.line, data: [{ name: "Active groups", labels, values: W.map(w => num(w.active_groups)) }, { name: "Collaborative groups", labels, values: W.map(w => num(w.collaborative_groups)) }], options: { chartColors: [C.green, C.teal], lineSize: 3, lineDataSymbolSize: 8 } }],
    Object.assign({}, chartBase)); else empty(s);

  // 4. Platforms
  s = slide("Where people use it", "Sessions per week on the website, the iPhone app and the Android app.");
  if (W.length) s.addChart(P.ChartType.bar, [{ name: "Website", labels, values: W.map(w => num(w.web_sessions)) }, { name: "iPhone app", labels, values: W.map(w => num(w.ios_sessions)) }, { name: "Android app", labels, values: W.map(w => num(w.android_sessions)) }],
    Object.assign({}, chartBase, { barGrouping: "stacked", chartColors: [C.blue, C.ink, C.green] })); else empty(s);

  // 5. Key actions per week
  const KEY = [["event_starred", "Stars", C.amber], ["event_locked_in", "Locked in", C.green], ["outbound_booking_clicked", "Tickets clicks", C.orange], ["invite_shared", "Invites shared", C.purple], ["directions_clicked", "Directions", C.teal]];
  s = slide("Key actions each week", "Records per week. Stars and lock-ins include plans kept on a device and group plans.");
  if (W.length) s.addChart(P.ChartType.line, KEY.map(([k, n]) => ({ name: n, labels, values: W.map(w => num(w.actions && w.actions[k] && w.actions[k].records)) })),
    Object.assign({}, chartBase, { chartColors: KEY.map(k => k[2]), lineSize: 3, lineDataSymbolSize: 7 })); else empty(s);

  // 6. Cities (only when the report covers more than one)
  const cities = r.by_city || [];
  if (cities.length > 1 || !r.city) {
    s = slide("Cities side by side", "People and actions in each city for the whole period. Someone who uses two cities counts in each.");
    if (cities.length) { const cl = cities.map(c => CN(c.city));
      s.addChart(P.ChartType.bar, [{ name: "Visitors and accounts", labels: cl, values: cities.map(c => num(c.identities)) }, { name: "Took a meaningful action", labels: cl, values: cities.map(c => num(c.meaningful_identities)) },
        { name: "Stars", labels: cl, values: cities.map(c => num(c.stars)) }, { name: "Locked in", labels: cl, values: cities.map(c => num(c.locks)) }],
        Object.assign({}, chartBase, { barDir: "col", barGrouping: "clustered", chartColors: [C.blue, C.orange, C.amber, C.green], showValue: true })); } else empty(s);
  }

  // 7. Categories
  const cats = (r.by_category || []).slice().sort((a, b) => num(b.views) + num(b.stars) * 3 - num(a.views) - num(a.stars) * 3).slice(0, 14).reverse();
  s = slide("What people look at, by kind of event", "Event views and stars per category for the whole period (top 14).");
  if (cats.length) { const cl = cats.map(c => (CATS_LABEL[c.category] || c.category || "Other"));
    s.addChart(P.ChartType.bar, [{ name: "Views", labels: cl, values: cats.map(c => num(c.views)) }, { name: "Stars", labels: cl, values: cats.map(c => num(c.stars)) }, { name: "Locked in", labels: cl, values: cats.map(c => num(c.locks)) }],
      Object.assign({}, chartBase, { barDir: "bar", barGrouping: "clustered", chartColors: [C.blue, C.amber, C.green] })); } else empty(s);

  // 8. Regions
  const regs = (r.by_region || []).slice().sort((a, b) => num(b.views) - num(a.views)).slice(0, 12).reverse();
  s = slide("Where the events are, by region", "Event views and stars per region for the whole period.");
  if (regs.length) { const rl = regs.map(x => String(x.region || "unknown").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase()));
    s.addChart(P.ChartType.bar, [{ name: "Views", labels: rl, values: regs.map(x => num(x.views)) }, { name: "Stars", labels: rl, values: regs.map(x => num(x.stars)) }],
      Object.assign({}, chartBase, { barDir: "bar", barGrouping: "clustered", chartColors: [C.blue, C.amber] })); } else empty(s);

  // 9. Top events
  const top = (r.top_items || []).slice().sort((a, b) => (num(b.stars) * 3 + num(b.locks) * 4 + num(b.booking_clicks) * 2 + num(b.detail_views)) - (num(a.stars) * 3 + num(a.locks) * 4 + num(a.booking_clicks) * 2 + num(a.detail_views))).slice(0, 14);
  s = slide("Top events", "Ranked by stars, lock-ins, Tickets clicks and views in the period.");
  if (top.length) s.addTable([hdr(["Event", "Kind", "Views", "Map", "Stars", "Locked", "Tickets", "People"]),
    ...top.map(t => [String(titles[t.item_id] || t.item_id).slice(0, 70), CATS_LABEL[t.category] || t.category || "", num(t.detail_views), num(t.map_opens), num(t.stars), num(t.locks), num(t.booking_clicks), num(t.identities)].map((v, i) => ({ text: String(v), options: { align: i < 2 ? "left" : "right" } })))],
    tableOpts([5.6, 1.9, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8])); else empty(s);

  // 10. Discovery to action
  const fun = r.funnel || [];
  s = slide("From first visit to action (within 7 days)", "Share of people first seen in the period (and at least 7 days ago) who did each step within a week.");
  if (fun.length && fun.some(f => num(f.eligible))) { const steps = ["Looked at an event", "Meaningful action", "Tickets click"];
    s.addChart(P.ChartType.bar, fun.filter(f => num(f.eligible)).map(f => ({ name: `${f.identity_type === "account" ? "Accounts" : "Visitors"} (${num(f.eligible)})`, labels: steps, values: [f.looked_at_event, f.meaningful_action, f.booking_click].map(v => Math.round(100 * num(v) / num(f.eligible))) })),
      Object.assign({}, chartBase, { barDir: "col", barGrouping: "clustered", chartColors: [C.blue, C.orange], showValue: true, dataLabelFormatCode: '0"%"', valAxisMaxVal: 100, valAxisLabelFormatCode: '0"%"' })); } else empty(s, "Not enough people first seen at least 7 days ago yet.");

  // 11. How people found it + platforms
  s = slide("How people found it and what they use", "Left: how each new visitor's first session arrived. Right: people by platform in the period.");
  const acq = {}; (r.acquisition || []).forEach(a => { const k = String(a.source || "direct / unknown"); acq[k] = (acq[k] || 0) + num(a.identities); });
  const ak = Object.keys(acq).sort((a, b) => acq[b] - acq[a]);
  if (ak.length) s.addChart(P.ChartType.doughnut, [{ name: "Source", labels: ak, values: ak.map(k => acq[k]) }], { x: 0.5, y: 1.45, w: 6.0, h: 5.4, chartColors: PAL, showLegend: true, legendPos: "b", legendFontFace: FONT, legendFontSize: 12, showPercent: true, dataLabelColor: "FFFFFF", dataLabelFontSize: 11, holeSize: 55 });
  else s.addText("No new visitors in this period.", { x: 0.5, y: 3.2, w: 6, h: 0.6, fontFace: FONT, fontSize: 16, color: C.grey, align: "center" });
  const pl = (r.platforms || []).filter(p => num(p.identities));
  const PLN = { web: "Website", ios: "iPhone app", android: "Android app" };
  if (pl.length) s.addChart(P.ChartType.pie, [{ name: "Platform", labels: pl.map(p => PLN[p.platform] || p.platform), values: pl.map(p => num(p.identities)) }], { x: 6.85, y: 1.45, w: 6.0, h: 5.4, chartColors: [C.blue, C.ink, C.green, C.grey], showLegend: true, legendPos: "b", legendFontFace: FONT, legendFontSize: 12, showPercent: true, dataLabelColor: "FFFFFF", dataLabelFontSize: 11 });

  // 12. Activation and retention
  s = slide("Do new people come back?", "Left: new people and how many acted in their first session or week. Right: people active again 1, 2 and 4 weeks after their first action.");
  const pc = (n, d) => d ? `${Math.round(100 * num(n) / num(d))}%` : "–";
  const act = (r.activation || []).slice().sort((a, b) => a.week < b.week ? 1 : -1).slice(0, 10);
  const ret = (r.retention || []).slice().sort((a, b) => a.cohort_week < b.cohort_week ? 1 : -1).slice(0, 10);
  const who = t => t === "account" ? "Accounts" : "Visitors";
  if (act.length) s.addTable([hdr(["First seen", "Who", "New", "Same visit", "In 7 days"]), ...act.map(a => [wkLabel(a.week), who(a.identity_type), num(a.new_identities), pc(a.same_session_activated, a.new_identities), a.eligible_7d ? pc(a.activated_7d, a.eligible_7d) : "not yet"].map((v, i) => ({ text: String(v), options: { align: i < 2 ? "left" : "right" } })))],
    Object.assign(tableOpts([1.3, 1.2, 0.9, 1.2, 1.2]), { w: 5.8 }));
  if (ret.length) s.addTable([hdr(["First action", "Who", "People", "Week 1", "Week 2", "Week 4"]), ...ret.map(x => [wkLabel(x.cohort_week), who(x.identity_type), num(x.cohort_size), x.week1 == null ? "not yet" : pc(x.week1, x.cohort_size), x.week2 == null ? "not yet" : pc(x.week2, x.cohort_size), x.week4 == null ? "not yet" : pc(x.week4, x.cohort_size)].map((v, i) => ({ text: String(v), options: { align: i < 2 ? "left" : "right" } })))],
    Object.assign(tableOpts([1.3, 1.1, 0.9, 0.9, 0.9, 0.9]), { x: 6.85, w: 6.0 }));
  if (!act.length && !ret.length) empty(s);

  // 13. How to read these numbers
  s = slide("How to read these numbers");
  s.addText([
    `Weeks run Monday to Sunday, ${r.timezone || "Los Angeles time"}. Measurement started ${r.instrumentation_start || "Nov 14, 2026"}.`,
    "A visitor is one browser or app install while signed out, not a person. An account is one signed-in account. The two are never added together.",
    "A meaningful action is a star, a lock-in, a confirmed group plan change, a calendar add (iPhone) or a click on a Tickets link. A Tickets click is not a purchase, and a locked-in plan is not attendance.",
    "Owner, test and development activity is left out. Each download of this file pulls the latest numbers for the city and number of weeks picked on the dashboard.",
    "Stars, lock-ins on device, clicks and views are reported by the device and can be lost offline; group plan changes are confirmed by the server."
  ].map(t => ({ text: t, options: { bullet: true, breakLine: true } })), { x: 0.6, y: 1.3, w: 12.1, h: 5.4, fontFace: FONT, fontSize: 16, color: C.ink, paraSpaceAfter: 12, valign: "top" });

  const stamp = gen.toISOString().slice(0, 10);
  await P.writeFile({ fileName: `weekend-fetch-engagement-${(r.city || "all-cities")}-${weeks}w-${stamp}.pptx` });
  return pageNo;
}
const CATS_LABEL = { hol: "Holiday", mkt: "Markets", dog: "Dog-friendly", food: "Pizza & coffee", art: "Art", walk: "Dog walks", show: "Concerts & shows", sport: "Sports", film: "Movies", kids: "Young kids", teen: "Teens", prog: "Programs & sign-ups", join: "Join in", vol: "Volunteer", cult: "Cultural celebrations", learn: "Talks & learning", fmd: "Free museum days", evt: "Other" };
async function load(){
  $("msg").innerHTML = ""; $("out").innerHTML = "<p class='sub'>Loading…</p>";
  const { data, error } = await client.rpc("admin_report", { p_weeks: +$("weeks").value, p_city: $("city").value || null });
  if (error) { $("msg").innerHTML = `<div class="err">${esc(error.message)}</div>`; $("out").innerHTML = ""; return; }
  REPORT = data; render(data);
}
(async () => {
  const { data } = await client.auth.getSession();
  if (!data.session) { $("msg").innerHTML = `<div class="note">Sign in on <a href="../#our-list">Our Plans</a> with the owner account, then come back to this page.</div>`; return; }
  const ok = await client.rpc("analytics_is_admin");
  if (ok.error || !ok.data) { $("msg").innerHTML = `<div class="err">This account doesn't have access to the engagement report.</div>`; return; }
  const today = new Date(), ago = new Date(Date.now() - 28 * 864e5);
  $("to").value = today.toISOString().slice(0, 10); $("from").value = ago.toISOString().slice(0, 10);
  $("controls").hidden = false;
  $("refresh").onclick = load; $("weeks").onchange = load; $("city").onchange = load;
  $("csvWeekly").onclick = () => REPORT && download(`fetch-weekly${$("city").value ? "-" + $("city").value : ""}.csv`, csv(REPORT.weekly.map(w => { const o = Object.assign({}, w); delete o.actions;
    ACTIONS.forEach(a => { const v = w.actions && w.actions[a[0]]; o[a[0] + "_records"] = v ? v.records : 0; o[a[0] + "_identities"] = v ? v.identities : 0; }); return o; })));
  $("deck").onclick = async () => {
    const b = $("deck"), was = b.textContent; b.disabled = true; b.textContent = "Building…"; $("msg").innerHTML = "";
    try {
      const { data, error } = await client.rpc("admin_report", { p_weeks: +$("weeks").value, p_city: $("city").value || null });
      if (error) throw error;
      REPORT = data; render(data);
      await buildDeck(data, $("city").value ? CITY_NAMES[$("city").value] || $("city").value : "All cities", +$("weeks").value);
    } catch (e) { $("msg").innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
    b.disabled = false; b.textContent = was;
  };
  $("csvRaw").onclick = async () => {
    const { data, error } = await client.rpc("admin_export", { p_from: $("from").value, p_to: $("to").value, p_include_excluded: $("incl").checked, p_city: $("city").value || null });
    if (error) { $("msg").innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    download(`fetch-records${$("city").value ? "-" + $("city").value : ""}-${$("from").value}-to-${$("to").value}.csv`, csv(data));
  };
  load();
})();
</script>
